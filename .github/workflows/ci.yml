name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-cpp:
    name: Build & Test system-cleaner-agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: |
          cmake --build build --config Release

      - name: Run Unit Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build\Release\unit_tests.exe

      - name: Run Unit Tests (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/unit_tests

      - name: Verify Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "build\Release\system-cleaner-agent.exe") {
            Write-Host "Build successful: system-cleaner-agent.exe exists"
            Get-Item "build\Release\system-cleaner-agent.exe"
          } else {
            Write-Error "Executable not found!"
            exit 1
          }

      - name: Upload Build Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: system-cleaner-agent-windows
          path: build/Release/system-cleaner-agent.exe
          retention-days: 7
